<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Assets team review workload: a daily review queue of open PRs needing MetaMask Assets review (Core, Mobile, Extension) plus historical team-level metrics. Team-level metrics only."
    />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M9 20.5 13.5 12l3 5.5 2.5-4.5 4 7.5z' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <title>Assets review workload · MetaMask</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ard-theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
