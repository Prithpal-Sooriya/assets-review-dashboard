# Collector CI: typecheck + deterministic aggregation/collection tests.
# (UI CI lives in ci-ui.yml, owned by the frontend. Filenames deliberately
# distinct so the two roles never edit each other's CI.)
name: ci-collector

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/collector/**"
      - "config/**"
      - "tsconfig.collector.json"
      - ".bun-version"
      - ".github/workflows/ci-collector.yml"
      - "bun.lock"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/collector/**"
      - "config/**"
      - "tsconfig.collector.json"
      - ".bun-version"
      - ".github/workflows/ci-collector.yml"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin bun version from .bun-version
        run: echo "BUN_VERSION=$(cat .bun-version)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (collector tsconfig)
        run: bunx tsc -p tsconfig.collector.json --noEmit
      - name: Tests
        run: bun test tests/collector/
