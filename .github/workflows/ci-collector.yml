# Collector CI: typecheck + deterministic aggregation/collection tests +
# workflow-lint. (UI CI lives in ci-ui.yml, owned by the frontend. Filenames
# deliberately distinct so the two roles never edit each other's CI.)
#
# The operational workflows (collect-data*.yml) and composite actions are
# the only code here that never runs in CI otherwise — without this gate a
# typo in them merges green and first executes as the monthly cron. The
# WORKFLOWS are linted (actionlint) on every PR that touches them; note the
# boundary: actionlint opens local composite actions only to validate
# call-site `with:` inputs — it does not lint expressions or steps inside
# them (it missed the secrets-context bug in run-token that the first real
# run caught), so action internals get no static lint here. The run-token
# policy shell is therefore extracted to scripts/run-token.sh and unit-
# tested in tests/collector/run-token.test.ts.
name: ci-collector

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/collector/**"
      - "config/**"
      - "tsconfig.collector.json"
      - ".bun-version"
      - ".github/workflows/ci-collector.yml"
      - ".github/workflows/collect-data.yml"
      - ".github/workflows/collect-data-heartbeat.yml"
      - ".github/workflows/data-pr-guard.yml"
      - ".github/actions/**"
      - "bun.lock"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/collector/**"
      - "config/**"
      - "tsconfig.collector.json"
      - ".bun-version"
      - ".github/workflows/ci-collector.yml"
      - ".github/workflows/collect-data.yml"
      - ".github/workflows/collect-data-heartbeat.yml"
      - ".github/workflows/data-pr-guard.yml"
      - ".github/actions/**"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin bun version from .bun-version
        run: echo "BUN_VERSION=$(cat .bun-version)" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar -xz -C /tmp actionlint
          /tmp/actionlint -color
      - name: Typecheck (collector tsconfig)
        run: bunx tsc -p tsconfig.collector.json --noEmit
      - name: Tests
        run: bun test tests/collector/
