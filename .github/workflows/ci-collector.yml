# Collector CI: typecheck + deterministic aggregation/collection tests.
# (UI CI lives in ci-ui.yml, owned by the frontend. Filenames deliberately
# distinct so the two roles never edit each other's CI.)
name: ci-collector

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/collector/**"
      - "config/**"
      - "tsconfig.collector.json"
      - ".github/workflows/ci-collector.yml"
      - "bun.lock"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/collector/**"
      - "config/**"
      - "tsconfig.collector.json"
      - ".github/workflows/ci-collector.yml"
      - "bun.lock"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (collector tsconfig)
        run: bunx tsc -p tsconfig.collector.json --noEmit
      - name: Tests
        run: bun test tests/collector/
