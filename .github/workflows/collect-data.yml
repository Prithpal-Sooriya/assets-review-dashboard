# Dashboard data collection: monthly schedule + manual dispatch.
#
# Collects raw PR/review partitions for the rolling window (12 completed
# months + current partial month), aggregates data/dashboard.json at a fixed
# run cutoff, and commits everything to the long-lived data branch
# `data/auto-refresh` — NEVER to the default branch. Opens or updates a
# single data PR (created with GITHUB_TOKEN, which does not trigger other
# workflows; this workflow runs the collector tests itself before pushing).
#
# Bounded continuation without sleep loops: the collector stops gracefully at
# the rate budget reserve (exit 3) after checkpointing progress; this run
# pushes the checkpoint, reports the reset time, and finishes paused-red.
# The hourly heartbeat workflow (collect-data-heartbeat.yml) re-dispatches
# this workflow once the rate window resets — automatic, no human re-run,
# no sleeping runner.
#
# Optional secret (no value stored here): DASHBOARD_GH_TOKEN — a classic PAT
# with repo scope. If set it is used instead of GITHUB_TOKEN (higher API
# rate budget, and PRs it creates DO trigger ci-collector.yml). Without it,
# GITHUB_TOKEN (contents+pull-requests: write) is used.
name: collect-data

on:
  schedule:
    - cron: "10 6 3 * *" # 3rd of each month, 06:10 UTC (month has closed)
  workflow_dispatch:
    inputs:
      start_date:
        description: "Window start date (YYYY-MM-DD). Default: 1st of the month 12 months ago."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect-data
  cancel-in-progress: false

env:
  DATA_BRANCH: data/auto-refresh
  BUN_VERSION: 1.4.2

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout default branch (collector scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: data-branch reconciliation needs merge bases
          ref: ${{ github.event.repository.default_branch }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Collector tests (gate before any data is written)
        run: bun test tests/collector/

      - name: Compute window and fixed run cutoff
        run: |
          set -euo pipefail
          echo "RUN_CUTOFF=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          START_DATE="${{ inputs.start_date }}"
          if [ -z "$START_DATE" ]; then
            FROM_MONTH=$(date -u -d "12 months ago" +%Y-%m)
          else
            if ! [[ "$START_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::start_date must be YYYY-MM-DD (got '$START_DATE')"
              exit 1
            fi
            FROM_MONTH="${START_DATE:0:7}"
          fi
          echo "FROM_MONTH=$FROM_MONTH" >> "$GITHUB_ENV"
          echo "window: $FROM_MONTH .. current; cutoff fixed at run start"

      - name: Reconcile data branch (preserve unmerged checkpoints)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/remotes/origin/$DATA_BRANCH"; then
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
            # Adopt script/config updates from the default branch while keeping
            # every unmerged data commit (checkpoints). Conflicts fail loudly.
            if ! git merge --no-edit "origin/${{ github.event.repository.default_branch }}"; then
              echo "::error::merge of default branch into $DATA_BRANCH conflicted; resolve manually"
              exit 1
            fi
          else
            git checkout -B "$DATA_BRANCH" "origin/${{ github.event.repository.default_branch }}"
          fi

      - name: Collect (resumable; pauses at rate reserve — heartbeat resumes)
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN || github.token }}
        run: |
          set -uo pipefail
          echo "collecting from $FROM_MONTH at fixed cutoff $RUN_CUTOFF (single attempt; the hourly heartbeat re-dispatches after the rate window resets)"
          bun run scripts/collect.ts --from "$FROM_MONTH" --as-of "$RUN_CUTOFF"
          rc=$?
          # Push progress immediately so checkpoints survive runner exits.
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): collect (cutoff $RUN_CUTOFF)"
            git push origin "$DATA_BRANCH"
          fi
          echo "COLLECT_RC=$rc" >> "$GITHUB_ENV"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "::error::collect exited $rc"; fi
          exit 0

      - name: Aggregate dashboard.json at the fixed cutoff
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          bun run scripts/aggregate.ts --as-of "$RUN_CUTOFF" --out data/dashboard.json
          git add data
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): aggregate at cutoff $RUN_CUTOFF"
          fi
          git push origin "$DATA_BRANCH"

      - name: Open or update the data PR
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          status="complete"
          if [ "$COLLECT_RC" -eq 3 ]; then
            pending=$(jq -r '.pending | join(", ")' data/raw/.last-run.json)
            reset=$(jq -r '.resetEpoch' data/raw/.last-run.json)
            reset_iso=$(date -u -d "@$reset" +%Y-%m-%dT%H:%M:%SZ)
            status="PAUSED at rate reserve — pending: $pending; rate window resets $reset_iso; the hourly heartbeat resumes automatically"
          fi
          coverage=$(jq -r '.coverage | group_by(.status) | map("\(.[0].status)=\(length)") | join(", ")' data/dashboard.json)
          months=$(jq -r '.months | length' data/dashboard.json)
          prs=$(jq -r '.prs | length' data/dashboard.json)
          {
            printf '🤖 Data refresh at cutoff %s (window from %s).\n\n' "$RUN_CUTOFF" "$FROM_MONTH"
            printf -- '- Collection status: %s\n' "$status"
            printf -- '- Coverage: %s\n' "$coverage"
            printf -- '- Month rows: %s - PR records: %s\n' "$months" "$prs"
            printf -- '- Collector tests passed in this run before any data was written.\n'
            printf -- '- Bounded continuation: this run pauses at the rate reserve (checkpoints pushed); the hourly heartbeat re-dispatches after the window resets.\n'
          } > /tmp/pr-comment.md
          existing=$(gh pr list --head "$DATA_BRANCH" --state open --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            {
              printf '<!-- data-pr: auto-refresh -->\n'
              printf '## Dashboard data (auto-refresh)\n\n'
              printf 'Rolling window (12 completed months + current partial month) of raw\n'
              printf 'PR/review partitions and the aggregated `data/dashboard.json`.\n'
              printf 'Updated by the `collect-data` workflow (monthly schedule + manual\n'
              printf 'dispatch). Methodology and completeness notes:\n'
              printf '[docs/collection.md](docs/collection.md).\n\n'
              printf 'This PR is updated (not recreated) on every run; checkpoints for\n'
              printf 'incomplete runs are preserved on this branch.\n'
            } > /tmp/pr-body.md
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$DATA_BRANCH" \
              --title "chore(data): dashboard data refresh" --body-file /tmp/pr-body.md
          fi
          gh pr comment "$DATA_BRANCH" --body-file /tmp/pr-comment.md

      - name: Mark the run paused-red if collection is incomplete
        if: env.COLLECT_RC == '3'
        run: |
          echo "::error::paused at rate budget reserve — progress is preserved on $DATA_BRANCH; the hourly heartbeat resumes automatically"
          exit 3
