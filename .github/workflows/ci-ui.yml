# UI CI for the assets review dashboard frontend.
#
# This workflow is owned by the UI role and only covers frontend-owned paths;
# the collector role owns the other workflow files in this directory. It is
# deliberately a separate file (ci-ui.yml) so the two roles never edit each
# other's CI.
name: UI CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/ui/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'vercel.json'
      - '.github/workflows/ci-ui.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ui/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'tsconfig.tests.json'
      - 'vite.config.ts'
      - 'playwright.config.ts'
      - 'vercel.json'
      - '.github/workflows/ci-ui.yml'

jobs:
  ui:
    name: Typecheck, unit, e2e
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Build variants and run e2e
        run: bun run test:ui
        env:
          PW_CHANNEL: chromium
