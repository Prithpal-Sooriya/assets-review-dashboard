# Composite action: sync data/ into the data-branch worktree and push.
# Single source for the rsync -> add -> commit-if-changed -> push sequence
# used after collection and after aggregation in collect-data.yml.
name: push-data
description: Commit data/ to the orphan data branch and push
inputs:
  message:
    description: Commit message
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        rsync -a --delete data/ /tmp/data-tree/data/
        git -C /tmp/data-tree add data
        if ! git -C /tmp/data-tree diff --staged --quiet; then
          git -C /tmp/data-tree -c user.name=dashboard-bot \
            -c user.email=dashboard-bot@users.noreply.github.com \
            commit -m "$MESSAGE"
          git -C /tmp/data-tree push origin "$DATA_BRANCH"
        else
          echo "no data changes to push"
        fi
