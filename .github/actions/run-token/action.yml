# Composite action: ref guard + run-token selection + auth preflight.
# Single source for the token policy used by collect-data.yml and
# collect-data-heartbeat.yml (was copy-pasted and already drifting).
#
# Contract:
#   requires: the repository checked out at the workspace root (the policy
#             shell lives at scripts/run-token.sh), and DEFAULT_BRANCH
#             already set in the environment (runtime-derived via
#             `gh repo view` by the caller)
#   provides: RUN_TOKEN and RUN_TOKEN_KIND in $GITHUB_ENV for subsequent
#             gh-calling steps (auth-preflighted)
#
# The shell logic is extracted to scripts/run-token.sh so the token policy
# (a security control) is unit-tested like the rest of the collector —
# composite-action internals get no static lint (actionlint validates
# call-site inputs only), and the inline version's secrets-context bug
# class lived precisely there. No GitHub template expressions exist below
# the env mapping.
#
# Guarantees (stated honestly): this guard protects runs of the UNMODIFIED
# default-branch copy of a workflow. A repo writer can push a guard-stripped
# branch copy and dispatch it — GitHub supplies secrets to any-branch
# workflow_dispatch — so containment additionally REQUIRES a fine-grained
# PAT: classic repo-scope tokens (ghp_ …, which grant every repo their owner
# can access) are refused outright. Fine-grained PATs are github_pat_ … and
# must be scoped to this repository only.
name: run-token
description: Guard non-default refs, select the run token (fine-grained PAT only), preflight auth
inputs:
  pat-secret:
    description: |
      DASHBOARD_GH_TOKEN routed by the caller (GitHub expression:
      secrets.DASHBOARD_GH_TOKEN OR the literal '__UNSET__' — written
      WITHOUT template syntax here because GitHub expands template
      expressions (the dollar-double-curly syntax) ANYWHERE in an action
      manifest, including this description, and the secrets context does
      not exist in composite-action files at all; an expanded reference
      fails template validation at job load, before any step runs).
      Composite actions cannot read the secrets context, so the caller
      must route it in.
      'required' is advisory at runtime for composite actions (the runner
      enforces it only for workflow_call reusable workflows), so the real
      tripwire is in the script: '__UNSET__' means the secret is unset
      (GITHUB_TOKEN fallback), while an empty value means the input was
      never routed and the run fails closed. actionlint additionally
      validates call-site inputs statically for every workflow
      ci-collector lints (.github/workflows/**).
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REF: ${{ github.ref }}
        PAT_SECRET: ${{ inputs.pat-secret }}
        BASE_TOKEN: ${{ github.token }}
      run: bash scripts/run-token.sh
